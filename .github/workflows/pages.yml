name: Publish public query
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify and expand public site
        run: |
          python3 - <<'PY'
          import json, pathlib, hashlib, tarfile
          manifest=json.loads(pathlib.Path('public-site-manifest.json').read_text())
          with open('site.tar.xz','wb') as out:
              for name, digest in sorted(manifest.items()):
                  data=pathlib.Path(name).read_bytes()
                  assert hashlib.sha256(data).hexdigest()==digest, name
                  out.write(data)
          with tarfile.open('site.tar.xz') as t:
              t.extractall('_site',filter='data')
          assert pathlib.Path('_site/index.html').is_file()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
